<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mollinaca games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 56px 24px;
      background: #f4f2e9;
      color: #253b3b;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 640px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 40px); }
    .intro { margin: 0 0 32px; color: #536862; }
    .game {
      display: block;
      padding: 24px;
      border: 1px solid #c9cec0;
      border-radius: 12px;
      color: inherit;
      background: #fffdf7;
      text-decoration: none;
    }
    .game:hover { border-color: #244a47; }
    .game + .game { margin-top: 16px; }
    .game:focus-visible { outline: 3px solid #244a47; outline-offset: 4px; }
    h2 { margin: 0 0 8px; font-size: 24px; }
    .game p { margin: 0 0 16px; }
    .play { color: #244a47; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>mollinaca games</h1>
    <p class="intro">Small games, strange ideas.</p>
    <a class="game" href="/text-tower/">
      <h2>Text Tower</h2>
      <p>Turn your words into a tower. Stack letter-shaped blocks and see how high you can build.</p>
      <span class="play">Play Text Tower →</span>
    </a>
    <a class="game" href="/draw-legs/">
      <h2>Draw Legs</h2>
      <p>Draw legs and watch them run.</p>
      <span class="play">Play Draw Legs →</span>
    </a>
  </main>
</body>
</html>
